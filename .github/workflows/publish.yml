name: Publish TypeScript Packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

  publish-core:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: packages/core
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm pkg set "version=$VERSION"

      - name: Publish @drakkar.software/anchor
        working-directory: packages/core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if npx npm@latest publish --provenance --access public; then
            exit 0
          fi
          NAME="$(node -p "require('./package.json').name")"
          VER="$(node -p "require('./package.json').version")"
          if npm view "${NAME}@${VER}" version >/dev/null 2>&1; then
            echo "${NAME}@${VER} already on the registry, skipping"
            exit 0
          fi
          exit 1

  publish-adapter-web:
    needs: publish-core
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: packages/adapter-web
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm pkg set "version=$VERSION"

      - name: Publish @drakkar.software/anchor-adapter-web
        working-directory: packages/adapter-web
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if npx npm@latest publish --provenance --access public; then
            exit 0
          fi
          NAME="$(node -p "require('./package.json').name")"
          VER="$(node -p "require('./package.json').version")"
          if npm view "${NAME}@${VER}" version >/dev/null 2>&1; then
            echo "${NAME}@${VER} already on the registry, skipping"
            exit 0
          fi
          exit 1

  publish-adapter-react-native:
    needs: publish-core
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: packages/adapter-react-native
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm pkg set "version=$VERSION"

      - name: Publish @drakkar.software/anchor-adapter-react-native
        working-directory: packages/adapter-react-native
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if npx npm@latest publish --provenance --access public; then
            exit 0
          fi
          NAME="$(node -p "require('./package.json').name")"
          VER="$(node -p "require('./package.json').version")"
          if npm view "${NAME}@${VER}" version >/dev/null 2>&1; then
            echo "${NAME}@${VER} already on the registry, skipping"
            exit 0
          fi
          exit 1
